services:
  - type: web
    name: college-coding-platform-api
    env: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: bash -c 'source .jdk_env.sh 2>/dev/null; exec gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120'
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
      - key: CORS_ORIGINS
        value: "*"
