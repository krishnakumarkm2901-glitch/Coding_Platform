services:
  # ─── API Server ─────────────────────────────────────
  # Handles HTTP requests, auth, CRUD, cache, AND code execution.
  # JDK is auto-installed during build via build.sh.
  - type: web
    name: nit-campus-coder-api
    env: python
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: bash -c 'source .jdk_env.sh 2>/dev/null; exec gunicorn -c gunicorn.conf.py app:app'
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
      - key: REDIS_URL
        sync: false
      - key: EXECUTION_MODE
        value: sync

  # ─── Code Execution Worker ──────────────────────────
  # Separate process that pulls submissions from Redis
  # and executes student code in isolation from the API.
  - type: worker
    name: nit-campus-coder-worker
    env: python
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: bash -c 'source .jdk_env.sh 2>/dev/null; exec python worker.py'
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
