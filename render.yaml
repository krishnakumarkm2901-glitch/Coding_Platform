services:
  # ─── API Server ─────────────────────────────────────
  # Handles HTTP requests only (auth, CRUD, cache).
  # Code execution is offloaded to the worker service.
  - type: web
    name: nit-campus-coder-api
    env: python
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
      - key: REDIS_URL
        sync: false
      - key: EXECUTION_MODE
        value: queue

  # ─── Code Execution Worker ──────────────────────────
  # Separate process that pulls submissions from Redis
  # and executes student code in isolation from the API.
  - type: worker
    name: nit-campus-coder-worker
    env: python
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
