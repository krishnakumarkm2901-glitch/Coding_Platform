version: '3.8'

services:
  # 1. Redis High-Speed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: nit_coder_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - nit_coder_net

  # 2. Scalable Stateless Flask API Cluster
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nit_coder_api
    restart: always
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/college_coding_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-super_secret_production_key_2026}
      - WEB_CONCURRENCY=4
      - GUNICORN_THREADS=8
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - nit_coder_net

volumes:
  redis_data:

networks:
  nit_coder_net:
    driver: bridge
